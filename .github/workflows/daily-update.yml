name: Daily Stock Screener Update

on:
  schedule:
    - cron: "25 13 * * 1-5"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ライブラリをインストール
        run: pip install yfinance pandas numpy requests

      - name: データ生成スクリプトを実行
        id: generate
        run: python stock-screener/scripts/generate.py

      - name: 生成されたJSONをコミット
        if: success()
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stock-screener/docs/data.json stock-screener/docs/universe.json
          git diff --staged --quiet || git commit -m "📊 Daily update: $(date -u '+%Y-%m-%d')"
          git push
