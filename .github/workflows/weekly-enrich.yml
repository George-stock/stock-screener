name: Weekly Industry Enrichment

on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

jobs:
  enrich:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ライブラリをインストール
        run: pip install yfinance pandas requests

      - name: Industry情報を取得
        run: python stock-screener/scripts/enrich_tickers.py

      - name: 更新されたCSVをコミット
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git stash
          git pull --rebase
          git stash pop
          git add stock-screener/scripts/tickers_enriched.csv stock-screener/scripts/industry_cache.json
          git diff --staged --quiet || git commit -m "🏭 Weekly industry enrichment: $(date -u '+%Y-%m-%d')"
          git push
