name: Weekly Industry Enrichment

on:
  schedule:
    - cron: "0 18 * * 0"  # 毎週日曜 UTC18:00 = ドイツ夏時間20:00
  workflow_dispatch:

jobs:
  enrich:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ライブラリをインストール
        run: pip install requests beautifulsoup4

      - name: Industry情報を取得（Finviz）　
        run: python stock-screener/stock-screener/scripts/enrich_tickers.py


      - name: 更新されたCSVをコミット
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stock-screener/scripts/tickers_enriched.csv stock-screener/scripts/industry_cache.json
          if git diff --staged --quiet; then
            echo "変更なし。コミットをスキップします。"
          else
            git commit -m "🏭 Weekly industry enrichment (Finviz): $(date -u '+%Y-%m-%d')"
            git fetch origin main
            git rebase origin/main
            git push
          fi
