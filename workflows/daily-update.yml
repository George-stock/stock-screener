name: Daily Stock Screener Update

on:
  schedule:
    # 毎日 UTC 21:00 = 日本時間 06:00（NYクローズの翌朝）
    - cron: "0 21 * * 1-5"
  workflow_dispatch:  # 手動実行ボタン

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ライブラリをインストール
        run: |
          pip install finvizfinance yfinance pandas numpy requests

      - name: データ生成スクリプトを実行
        run: python scripts/generate.py

      - name: 生成されたJSONをコミット
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/universe.json
          git diff --staged --quiet || git commit -m "📊 Daily update: $(date -u '+%Y-%m-%d')"
          git push
